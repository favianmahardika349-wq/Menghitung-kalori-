
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Kalori Makanan</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:380px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#2e7d32;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:15px;
}

select,input{
    width:100%;
    padding:10px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2e7d32;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#256428;
}

.hasil{
    margin-top:20px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#d32f2f;
}
</style>

</head>
<body>

<div class="container">

<h1>Kalkulator Kalori</h1>

<label>Pilih Makanan</label>

<select id="makanan">
    <option value="130">Nasi Putih (100 g)</option>
    <option value="155">Telur Rebus (1 butir)</option>
    <option value="239">Ayam Goreng (100 g)</option>
    <option value="165">Dada Ayam Rebus (100 g)</option>
    <option value="89">Pisang (100 g)</option>
    <option value="52">Apel (100 g)</option>
    <option value="250">Mi Instan (1 bungkus)</option>
</select>

<label>Jumlah Porsi</label>

<input type="number" id="porsi" value="1" min="1">

<button onclick="hitungKalori()">
Hitung Kalori
</button>

<div class="hasil" id="hasil">
Total Kalori: 0 kkal
</div>

</div>

<script>

function hitungKalori(){

let kalori = Number(document.getElementById("makanan").value);

let porsi = Number(document.getElementById("porsi").value);

let total = kalori * porsi;

document.getElementById("hasil").innerHTML =
"Total Kalori: <br>" + total + " kkal";

}

</script>

</body>
</html>
